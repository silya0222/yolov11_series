# YOLOv11n - 融合版 (Baseline + SimAM + C2f_SE + Swin + ASFF)

nc: 6  # NEU-DET 类别数
scales:
  n: [0.50, 0.25, 1024] # 沿用您提供的 scales 配置

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4

  # 【模块 1】替换 C3k2 为 C2f_SE (浅层注意力)
  - [-1, 2, C2f_SE, [256, False, 0.25]] # 2

  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32

  # 【模块 2】替换 C3k2 为 SwinTransformerBlock (深层特征提取)
  - [-1, 1, SwinTransformerBlock, [1024]] # 8

  - [-1, 1, SPPF, [1024, 5]]  # 9

  # 【模块 3 (Backbone)】Backbone 末尾的 SimAM
  #- [-1, 1, SimAM, [1024]] # 10 (P5 输出) -> 注意：这层会导致 Head 索引全部 +1

# YOLOv11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (原10)
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4 (Layer 6)
  - [-1, 2, C3k2, [512, False]] # 13 (P4 融合特征)

  # 【模块 4 (Head)】保留 Head 中的 SimAM (这是我们之前修复 Bug 加的)
  - [-1, 1, SimAM, [512]] # 14 (原13)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (原14)
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3 (Layer 4)
  - [-1, 2, C3k2, [256, False]] # 17 (P3输出) -> ASFF 输入之一

  - [-1, 1, Conv, [256, 3, 2]] # 18

  # Concat 索引调整：
  # 引用 Head P4 (Layer 14, 即 Head 里的 SimAM)
  - [[-1, 14], 1, Concat, [1]] # 19 (原18) cat head P4

  - [-1, 2, C3k2, [512, False]] # 20 (P4输出) -> ASFF 输入之一

  - [-1, 1, Conv, [512, 3, 2]] # 21

  # Concat 索引调整：
  # 引用 Backbone P5 (Layer 10, 即 Backbone 里的 SimAM)
  - [[-1, 10], 1, Concat, [1]] # 22 (原21) cat backbone P5

  - [-1, 2, C3k2, [1024, True]] # 23 (P5输出) -> ASFF 输入之一

  # 【模块 5 (Detect)】ASFF 替换 Detect
  # 输入层为 P3(17), P4(20), P5(23)
  - [ [ 17, 20, 23 ], 1, ASFF, [ 0 ] ] # 24 - level 0
  - [ [ 17, 20, 23 ], 1, ASFF, [ 1 ] ] # 25 - level 1
  - [ [ 17, 20, 23 ], 1, ASFF, [ 2 ] ] # 26 - level 2

  - [ [ 24, 25, 26 ], 1, Detect, [ nc ] ] # 27