# Ultralytics YOLO11n-CBAM Custom Model Configuration
# 这是一个 "魔改" 后的 YOLOv11 配置文件
# 我们在 Backbone 的末尾添加了 CBAM 注意力机制

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

  # --- 魔改区域 Start ---
  # 原版 YOLOv11 这里是结束了或者接 C2PSA。
  # 我们将其替换为 CBAM 模块。
  # args: [channels, kernel_size] -> 对应 CBAM.__init__ 的参数
  # 注意：上一层输出是 1024 通道，所以这里输入也是 1024
  - [-1, 1, CBAM, [1024]] # 10
  # --- 魔改区域 End ---

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  # 注意：这里 cat 的是 10，也就是我们刚才加入的 CBAM 层
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)